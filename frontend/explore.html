<body><header class="site-header"><div class="container nav"><a class="brand" href="index.html">NEXORA<span>.</span></a><nav class="desktop-nav"><a class="active" href="explore.html">Explore</a><a href="index.html#categories">Categories</a><a href="index.html#about">About</a></nav><div class="nav-actions"><a class="login-link" href="login.html">Log in</a><a class="pill dark" href="register.html">Create account</a></div><button class="menu-btn" id="menuBtn">☰</button></div><div class="mobile-menu" id="mobileMenu"><a href="index.html">Home</a><a href="explore.html">Explore</a><a href="index.html#categories">Categories</a><a href="login.html">Log in</a></div></header>
<main><section class="page-hero"><div class="container"><div class="eyebrow">The full calendar</div><h1>Find your<br><em>next thing.</em></h1><p>Search by event, venue, category or neighbourhood. Discover what's happening around Pune.</p></div></section>
<section class="container explore-layout"><aside class="filters"><b>Refine your search</b><label>Search<input id="exploreSearch" placeholder="e.g. jazz, pottery, Baller"></label>
<label>Category<select id="categoryFilter"></select></label><label>Location<input id="cityFilter" placeholder="Pune, Kothrud, Baner..." list="exploreLocations"></label><datalist id="exploreLocations"></datalist>
<label>Date<select id="dateFilter"><option value="all">Any date</option><option value="today">Today</option><option value="weekend">This weekend</option></select></label>
<button class="pill dark full" id="applyFilters">Apply filters</button><button class="text-button" id="clearFilters">Clear all</button></aside>
<section><div class="results-bar"><span id="resultCount">Events</span><span class="results-hint">Click any card for full details</span></div><div class="events-grid" id="allEvents"></div></section></section></main>
<footer class="footer"><div class="container footer-bottom"><span>© 2026 Nexora</span><a href="index.html">Back home ↑</a></div></footer><script src="js/main.js"></script></body></html>
