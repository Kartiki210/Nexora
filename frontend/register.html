<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create account — Nexora</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="auth-shell"><a class="brand" href="index.html">NEXORA<span>.</span></a><div class="auth-card"><div class="eyebrow">Join Nexora</div><h1>Make room<br>for <em>more.</em></h1><form id="registerForm"><label>Name<input id="registerName" required placeholder="Your name"></label><label>Email<input id="registerEmail" type="email" required placeholder="you@example.com"></label><label>Password<div class="password-wrap"><input id="registerPassword" type="password" required minlength="6" placeholder="At least 6 characters"><button type="button" class="eye-btn" data-target="registerPassword" aria-label="Show password">◉</button></div></label><button class="pill terracotta full" type="submit">Create account</button><p id="authMsg"></p></form><div class="auth-footer">Already have an account? <a href="login.html">Log in</a></div></div></main><script src="js/main.js"></script></body></html>
